name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Fix PHP code style
        if: github.event_name == 'pull_request'
        run: ./vendor/bin/pint

      - name: Fix front-end code style
        if: github.event_name == 'pull_request'
        run: npx vp check --fix

      - name: Commit fixed files
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Fixes coding style"
          file_pattern: app bootstrap config database resources routes tests

      - name: Run CI Checks
        run: composer ci:check